name: Save POI Image

# Publishes a single image copied from the site's save modal. Run this
# once per pending image, pasting in its id and data URL.

on:
  workflow_dispatch:
    inputs:
      image_id:
        description: 'image_id (uuid) shown next to the image in the save modal'
        required: true
        type: string
      image_data_url:
        description: 'data:image/...;base64,... copied from the save modal'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  save-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Decode, resize, and write image
        # Passed via env (not interpolated directly into the script) so
        # the input is treated as data, not shell code.
        env:
          IMAGE_ID: ${{ inputs.image_id }}
          IMAGE_DATA_URL: ${{ inputs.image_data_url }}
        run: node scripts/save-poi-image.mjs

      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/poi-images
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Add/update POI image ${{ inputs.image_id }}"
            git push
          fi

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
